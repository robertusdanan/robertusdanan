<svg xmlns="http://www.w3.org/2000/svg" width="855" height="230" viewBox="0 0 855 230" role="img" aria-label="Robertus Danan - Creator, ViberCoder, TraderBot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type"><rect x="40" y="130" width="0" height="30">
      <animate attributeName="width" values="0;570;570;0" keyTimes="0;.45;.9;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}</style>

  <rect x=".5" y=".5" width="854" height="229" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x=".5" y=".5" width="854" height="229" rx="14" fill="url(#grid)" opacity=".55"/>

  <!-- stars -->
  <g fill="#9fb3d9">
    <circle cx="60" cy="40" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="190" r="1.2"><animate attributeName="opacity" values=".9;.2;.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="205" r="1.2"><animate attributeName="opacity" values=".9;.2;.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="60" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="40" y="44" font-size="12" fill="#5eead4" letter-spacing="4">PLAYER 1 · READY</text>
  <text class="sans" x="40" y="108" font-size="52" font-weight="800" fill="url(#title)" letter-spacing="2">ROBERTUS DANAN</text>
  <g clip-path="url(#type)">
    <text x="40" y="150" font-size="15" fill="#cbd5e1" letter-spacing="1">Creator · ViberCoder (Web Android Ai-Agent) · TraderBot</text>
  </g>
  <text x="40" y="190" font-size="12" fill="#64748b" letter-spacing="2">TULUNGAGUNG, EAST JAVA · INDONESIA</text>
  <text x="40" y="212" font-size="12" fill="#ffd166" letter-spacing="4">▶ PRESS START<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.2s" repeatCount="indefinite"/></text>

  <!-- enemy formation -->
  <g transform="translate(610 44)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0;-14 0;0 0" dur="4s" repeatCount="indefinite"/>
      <g fill="#14b8a6">
        <rect x="0" y="0" width="14" height="14" rx="3"/><rect x="24" y="0" width="14" height="14" rx="3" fill="#5eead4"/><rect x="48" y="0" width="14" height="14" rx="3"/><rect x="72" y="0" width="14" height="14" rx="3" fill="#0f766e"/><rect x="96" y="0" width="14" height="14" rx="3" fill="#5eead4"/>
        <rect x="12" y="24" width="14" height="14" rx="3" fill="#0f766e"/><rect x="36" y="24" width="14" height="14" rx="3"/><rect x="60" y="24" width="14" height="14" rx="3" fill="#5eead4"/><rect x="84" y="24" width="14" height="14" rx="3"/>
        <rect x="24" y="48" width="14" height="14" rx="3" fill="#5eead4"/><rect x="48" y="48" width="14" height="14" rx="3" fill="#0f766e"/><rect x="72" y="48" width="14" height="14" rx="3" fill="#14b8a6"/>
      </g>
    </g>
  </g>

  <!-- ship + bullet loop -->
  <g transform="translate(665 178)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0;-14 0;0 0" dur="4s" repeatCount="indefinite"/>
      <rect x="-1.5" y="-14" width="3" height="10" rx="1.5" fill="#ffd166" filter="url(#glow)">
        <animate attributeName="y" values="-14;-110" dur=".7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur=".7s" repeatCount="indefinite"/>
      </rect>
      <path d="M0 -16 L5 -5 L13 4 L13 11 L5 8 L0 12 L-5 8 L-13 11 L-13 4 L-5 -5 Z" fill="#ff4d6d" filter="url(#glow)"/>
      <path d="M0 -9 L3 -2 L0 3 L-3 -2 Z" fill="#0b1020" opacity=".85"/>
      <path d="M-3 11 L0 15 L3 11 Z" fill="#ffd166"><animate attributeName="d" values="M-3 11 L0 15 L3 11 Z;M-3 11 L0 21 L3 11 Z;M-3 11 L0 15 L3 11 Z" dur=".18s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
